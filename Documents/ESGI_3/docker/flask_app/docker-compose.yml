version: '3.8'

services:
  flask:
    build: .
    ports:
      - "5000:5000"  # pour le développement, pas nécessaire pour le déploiement
    networks:
      - flask-network

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
    depends_on:
      - flask
    networks:
      - flask-network

networks:
  flask-network:
